<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to Conlang Club @ UCSD…</title>
<meta name="description" content="This page has moved to conlangatucsd.com. Redirecting…">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://conlangatucsd.com/">
<!-- Static fallback: crawlers / no-JS go to the homepage. JS below preserves the deep path. -->
<meta http-equiv="refresh" content="0; url=https://conlangatucsd.com/">
<script>
(function () {
  var TARGET = "https://conlangatucsd.com";
  try {
    var dest = TARGET + window.location.pathname + window.location.search + window.location.hash;
    window.location.replace(dest);
  } catch (e) {
    window.location.href = TARGET + "/";
  }
})();
</script>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#FFF6E7;color:#17110f}
  main{text-align:center;padding:24px;max-width:40ch}
  a{color:#4b2fb3}
  code{word-break:break-all}
</style>
</head>
<body>
<main>
  <h1>We've moved</h1>
  <p>This page now lives at <a id="dest" href="https://conlangatucsd.com/">conlangatucsd.com</a>.</p>
  <p><a id="manual" href="https://conlangatucsd.com/">Click here if you are not redirected</a>.</p>
  <noscript><p>JavaScript is off. You were sent to the homepage.</p></noscript>
</main>
<script>
(function () {
  try {
    var dest = "https://conlangatucsd.com" + window.location.pathname + window.location.search + window.location.hash;
    var a = document.getElementById("manual");
    var b = document.getElementById("dest");
    if (a) a.href = dest;
    if (b) { b.href = dest; b.textContent = dest; }
    var c = document.querySelector('link[rel="canonical"]');
    if (c) c.href = dest;
  } catch (e) {}
})();
</script>
</body>
</html>
